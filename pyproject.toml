[project]
name = "clinical-copilot"
version = "0.1.0"
description = "AI Clinical Copilot Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flashtext>=2.7",
    "gliner>=0.2.28",
    "google-genai>=1.67.0",
    "matplotlib>=3.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "peft>=0.18.1",
    "pymupdf>=1.27.2.3",
    "pyqt6>=6.4.0",
    "pytest>=7.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "qwen-vl-utils>=0.0.14",
    "rapidfuzz>=3.14.6",
    "reportlab>=4.4.10",
    "safetensors>=0.4.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.7.0",
    "symspellpy>=6.10.0",
    "torch>=2.0.0",
    "torchvision>=0.26.0",
    "transformers>=4.30.0",
    "xgboost>=3.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]
