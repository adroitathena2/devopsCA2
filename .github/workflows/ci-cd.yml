# Clinical Copilot — CI/CD (GitHub Actions)
# Task 1: Deployment Strategy. Tool chosen: GitHub Actions
# (free, native to GitHub, Docker + K8s friendly; alternatives
#  Codefresh/Harness/Spinnaker need external SaaS).
name: clinical-copilot-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service deps
        run: |
          pip install -r service/requirements-service.txt pyyaml
      - name: Run pytest (service contract tests only; ML tests need GPU + DrugBank cache)
        run: |
          pytest tests/test_service.py -v
      - name: Validate K8s manifests (no cluster needed)
        run: |
          kubectl version --client
          python devops/validate_manifests.py

  build-and-push:
    name: Build & push Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Falls back to local/ prefix when the secret is absent so build-only runs still tag validly.
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'local' }}/clinical-copilot
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub secrets present
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME/TOKEN secrets absent: image will be built but not pushed."
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Push only when registry secrets exist; otherwise build-only validation.
          push: ${{ steps.dockerhub.outputs.present == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy-staging:
    name: Rolling update (staging)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/clinical-copilot
    steps:
      - uses: actions/checkout@v4
      - name: Check kubeconfig secret present
        id: kubeconfig
        run: |
          if [ -n "${{ secrets.KUBECONFIG_STAGING }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "KUBECONFIG_STAGING secret absent: skipping cluster deploy."
          fi
      - name: Setup kubeconfig
        if: steps.kubeconfig.outputs.present == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
      - name: Rolling update to new image
        if: steps.kubeconfig.outputs.present == 'true'
        run: |
          kubectl set image deployment/clinical-copilot \
            clinical-copilot=${{ env.IMAGE_NAME }}:latest -n staging
          kubectl rollout status deployment/clinical-copilot -n staging --timeout=180s
      - name: Smoke test
        if: steps.kubeconfig.outputs.present == 'true'
        run: |
          kubectl port-forward svc/clinical-copilot 8000:80 -n staging &
          sleep 5
          curl -f http://localhost:8000/health
          curl -f -X POST http://localhost:8000/analyze \
            -H 'Content-Type: application/json' \
            -d '{"text":"Aspirin 75mg + Clopidogrel 75mg"}'
