# Clinical Copilot — CI/CD (GitHub Actions)
# Task 1: Deployment Strategy. Tool chosen: GitHub Actions
# (free, native to GitHub, Docker + K8s friendly; alternatives
#  Codefresh/Harness/Spinnaker need external SaaS).
name: clinical-copilot-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/clinical-copilot

jobs:
  test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service deps
        run: |
          pip install -r requirements-service.txt pyyaml
      - name: Run pytest (service contract tests only; ML tests need GPU + DrugBank cache)
        run: |
          pytest test_service.py -v
      - name: Validate K8s manifests (no cluster needed)
        run: |
          kubectl version --client
          python devops/validate_manifests.py

  build-and-push:
    name: Build & push Docker image
    needs: test
    # Skipped when Docker Hub secrets are absent (college demo: build validated locally).
    # Add DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets to enable push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy-staging:
    name: Rolling update (staging)
    needs: build-and-push
    # Requires KUBECONFIG_STAGING (base64 kubeconfig) repo secret; skipped without it.
    if: secrets.KUBECONFIG_STAGING != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
      - name: Rolling update to new image
        run: |
          kubectl set image deployment/clinical-copilot \
            clinical-copilot=${{ env.IMAGE_NAME }}:latest -n staging
          kubectl rollout status deployment/clinical-copilot -n staging --timeout=180s
      - name: Smoke test
        run: |
          kubectl port-forward svc/clinical-copilot 8000:80 -n staging &
          sleep 5
          curl -f http://localhost:8000/health
          curl -f -X POST http://localhost:8000/analyze \
            -H 'Content-Type: application/json' \
            -d '{"text":"Aspirin 75mg + Clopidogrel 75mg"}'
